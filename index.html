<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Igor Vilela’s CV and portfolio in electronics, computer vision and electrical grid inspection.">
  <meta name="theme-color" content="#faf9f6">
  <title>Igor Vilela · CV &amp; Portfolio</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #161b2b;
      --muted: #515767;
      --blue: #254bd9;
      --blue-dark: #1734a3;
      --paper: #faf9f6;
      --sand: #eae2d7;
      --panel: #fcfaf6;
      --line: #dedad2;
      --wrap: 71rem;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 1rem/1.65 system-ui, sans-serif; }
    h1, h2, p, figure { margin: 0; }
    [hidden] { display: none !important; }
    a { color: var(--blue-dark); text-underline-offset: .25em; }
    a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
    .wrap { width: min(calc(100% - 3rem), var(--wrap)); margin-inline: auto; }
    .skip { position: absolute; top: -8rem; left: 1rem; background: white; padding: .65rem; z-index: 2; }
    .skip:focus { top: 1rem; }
    .masthead { background: white; border-bottom: 1px solid var(--line); }
    .bar, nav, .actions { display: flex; align-items: center; flex-wrap: wrap; gap: .45rem 1.2rem; }
    .bar { justify-content: space-between; min-height: 5rem; padding-block: .85rem; }
    .brand { display: inline-flex; align-items: center; gap: .65rem; color: var(--ink); font-weight: 780; text-decoration: none; }
    .brand::before { content: ""; width: .7rem; height: .7rem; border-radius: .2rem; background: var(--blue); }
    nav { column-gap: .25rem; }
    nav a { color: var(--muted); font-size: .88rem; font-weight: 650; text-decoration: none; padding: .35rem .7rem; border-radius: 99rem; }
    nav a:hover, nav a[aria-current="page"] { color: var(--blue-dark); background: #edf0fd; }
    .home { background: linear-gradient(90deg, var(--sand) 0 39%, var(--paper) 39%); }
    .home-grid { display: grid; grid-template-columns: minmax(14rem, 19rem) minmax(0, 36rem); align-items: center; justify-content: center; gap: clamp(2rem, 7vw, 6rem); padding-block: clamp(3rem, 10vw, 8.5rem); }
    .profile { background: var(--panel); text-align: center; border: 1px solid #fffc; border-radius: 1.35rem; overflow: hidden; box-shadow: 0 1px 2px #28251a12, 0 22px 58px #3c302621; }
    .profile-body { padding: 2rem 1.5rem 1.6rem; }
    .avatar { display: grid; place-items: center; width: 8rem; height: 8rem; margin: 0 auto 1.1rem; border-radius: 50%; background: linear-gradient(135deg, #e4eafc, #f1eee9); color: var(--blue-dark); font-size: 2.6rem; letter-spacing: -.08em; font-weight: 750; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-name { font-size: 1.6rem; font-weight: 800; letter-spacing: -.045em; }
    .eyebrow { color: var(--muted); font-size: .72rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .profile-links { display: flex; justify-content: center; flex-wrap: wrap; gap: .5rem 1rem; background: white; border-top: 1px solid var(--line); padding: .75rem; }
    .profile-links a { color: var(--ink); font-size: .85rem; font-weight: 700; }
    .eyebrow { color: var(--blue-dark); }
    h1 { font-size: clamp(2.6rem, 7vw, 5.6rem); letter-spacing: -.075em; line-height: 1.02; }
    .hero-title { font-size: clamp(3rem, 8vw, 6.6rem); letter-spacing: -.08em; margin-bottom: .6rem; }
    .lead { color: var(--muted); font-size: clamp(1.15rem, 2.4vw, 1.55rem); line-height: 1.35; font-weight: 560; }
    .actions { margin-top: 1.8rem; gap: .65rem; }
    .button { display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--blue); border-radius: 99rem; background: var(--blue); color: white; padding: .55rem 1.1rem; font: inherit; font-size: .89rem; font-weight: 720; text-decoration: none; cursor: pointer; }
    .button:hover { background: var(--blue-dark); }
    .button.secondary { color: var(--ink); background: transparent; border-color: #a6acba; }
    .button.secondary:hover { border-color: var(--blue); color: var(--blue-dark); }
    .cv-action { font-size: .85rem; margin-left: .25rem; border: 0; background: transparent; color: var(--blue-dark); padding: .4rem .25rem; text-decoration: underline; text-underline-offset: .25em; font-family: inherit; cursor: pointer; }
    .chapter { padding-block: clamp(2.4rem, 7vw, 5.5rem); }
    .chapter-head { max-width: 47rem; margin-bottom: 1.8rem; }
    .chapter h1 { margin-block: .35rem .75rem; font-size: clamp(2.45rem, 6vw, 4.4rem); }
    .chapter-head > p:last-child { color: var(--muted); max-width: 58ch; }
    .entries { display: grid; gap: 1rem; max-width: 53rem; }
    .entry { background: white; border: 1px solid var(--line); border-radius: .9rem; padding: clamp(1.15rem, 3.7vw, 2rem); }
    .entry h2 { font-size: clamp(1.22rem, 3vw, 1.65rem); letter-spacing: -.032em; line-height: 1.23; }
    .entry > * + * { margin-top: .65rem; }
    .meta, figcaption { color: var(--muted); font-size: .91rem; }
    .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; list-style: none; padding: 0; margin-bottom: 0; counter-reset: step; }
    .steps li { counter-increment: step; background: #f2f4fc; padding: .75rem; font-size: .87rem; font-weight: 650; }
    .steps li::before { content: "0" counter(step); display: block; color: var(--blue-dark); font-size: .72rem; font-weight: 800; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); gap: 1rem; margin-top: 1.15rem; }
    .gallery a { display: block; }
    .gallery img { display: block; width: 100%; max-height: 24rem; object-fit: contain; background: var(--panel); }
    figcaption { margin-top: .35rem; }
    .documents { list-style: none; padding: 0; display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 0; }
    .documents a { display: inline-block; padding: .42rem .75rem; border: 1px solid #b5c0ec; border-radius: .35rem; font-size: .87rem; font-weight: 650; overflow-wrap: anywhere; }
    .documents a:hover { background: #f2f4fc; }
    footer { background: white; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
    footer .wrap { padding-block: 1.15rem; }
    @media (max-width: 43rem) {
      .wrap { width: min(calc(100% - 2rem), var(--wrap)); }
      .bar { align-items: flex-start; flex-direction: column; }
      nav { column-gap: .15rem; }
      nav a { padding-inline: .52rem; }
      .home { background: linear-gradient(180deg, var(--sand) 0 13rem, var(--paper) 13rem); }
      .home-grid { grid-template-columns: 1fr; }
      .profile { width: min(100%, 19rem); }
    }
    @media (max-width: 27rem) { .steps { grid-template-columns: 1fr; } }
    @media print {
      body { background: white; color: black; font-size: 10pt; }
      .wrap { width: 100%; }
      .masthead, .skip, footer, .actions, .profile, .gallery, .documents { display: none !important; }
      main > section[hidden] { display: block !important; }
      .home { background: none; }
      .home-grid { display: block; padding: 0 0 1rem; }
      .chapter { padding-block: .5rem; }
      .chapter-head { margin-bottom: .5rem; }
      .chapter-head > p { display: none; }
      .chapter h1 { font-size: 17pt; }
      .hero-title { font-size: 29pt; }
      .entry { break-inside: avoid; padding: .45rem 0; border: 0; }
      .entry h2 { font-size: 12pt; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="masthead">
    <div class="wrap bar">
      <a class="brand" href="#about">Igor Vilela</a>
      <nav aria-label="CV sections">
        <a href="#about" aria-current="page">About</a>
        <a href="#experience">Experience</a>
        <a href="#education">Education</a>
        <a href="#projects">Projects</a>
        <a href="#publications">Publications</a>
      </nav>
    </div>
  </header>
  <main id="content" tabindex="-1">
    <section class="home" id="about" aria-labelledby="about-title">
      <div class="wrap home-grid">
        <aside class="profile" aria-label="Profile">
          <div class="profile-body">
            <div id="avatar" class="avatar" aria-hidden="true">IV</div>
            <p class="profile-name">Igor Vilela</p>
          </div>
          <div class="profile-links">
            <a href="https://github.com/igorcerveiravilela97">GitHub</a>
          </div>
        </aside>
        <div>
          <h1 id="about-title" class="hero-title" tabindex="-1">Igor Vilela</h1>
          <p class="lead">Electrical Engineer</p>
          <div class="actions">
            <a class="button" href="#experience">Explore my CV</a>
            <a class="button secondary" href="#projects">View projects</a>
            <a id="download-cv" class="cv-action" download hidden>Download CV</a>
            <button id="print-cv" class="cv-action" type="button" hidden>Print / Save as PDF</button>
          </div>
        </div>
      </div>
    </section>
    <noscript><p class="wrap">Enable JavaScript to browse the CV sections.</p></noscript>
  </main>
  <footer><div class="wrap">Igor Vilela · CV &amp; Portfolio</div></footer>

  <!-- EDIT CV CONTENT HERE.
       Upload public files to assets/ on GitHub, then use their relative paths here.
       Set profilePhoto to "assets/profile.jpg" and cvPdf to "assets/igor-vilela-cv.pdf" if available.
       Each entry can have any number of attachments. Example attachment objects:
         {"kind":"image","label":"Inspection example","alt":"Insulator marked by a detection box","src":"assets/example.jpg"}
         {"kind":"pdf","label":"Conference paper","src":"assets/paper.pdf"}
         {"kind":"document","label":"Project report","src":"assets/report.docx"}
       Put those objects inside the relevant entry's attachments array. Keep valid JSON.
  -->
  <script type="application/json" id="cv-data">
  {
    "profilePhoto": "",
    "cvPdf": "",
    "sections": [
      {
        "id": "experience",
        "title": "Experience",
        "number": "01",
        "intro": "Professional work in electronics repair and development.",
        "entries": [
          {
            "title": "Electronics Technician",
            "meta": "Mixtrónica",
            "description": "Electronics repair and development, including fault diagnosis and troubleshooting.",
            "attachments": []
          }
        ]
      },
      {
        "id": "education",
        "title": "Education",
        "number": "02",
        "intro": "Academic training in electrical and computer engineering.",
        "entries": [
          {
            "title": "Master’s studies in Electrical Engineering",
            "meta": "Coimbra Institute of Engineering (ISEC)",
            "description": "Master’s project on multi-stage object detection for electrical grid asset inspection.",
            "attachments": []
          },
          {
            "title": "Bachelor’s degree in Electrical and Computer Engineering",
            "meta": "Coimbra Institute of Engineering (ISEC) · 2024 · Final grade 19/20",
            "attachments": []
          }
        ]
      },
      {
        "id": "projects",
        "title": "Projects",
        "number": "03",
        "intro": "Applied computer vision for aerial inspection of electrical grid assets.",
        "entries": [
          {
            "title": "Multi-stage inspection of high-voltage insulators",
            "meta": "Master’s project · YOLO · Aerial inspection",
            "description": "I evaluated whether locating insulators first and assessing their condition in individual crops improves defect detection in aerial images. The two-stage approach improved detection metrics in the RECPAD 2026 evaluation with 640-pixel inputs.",
            "steps": ["Locate insulators", "Extract crops from the original image", "Assess insulator condition"],
            "attachments": []
          },
          {
            "title": "Transfer learning and input resolution",
            "meta": "YOLOv11 · Insulator Defect Image Dataset",
            "description": "I compared five YOLOv11 model sizes at three input resolutions. YOLOv11-L at 1280 pixels achieved the highest mean test mAP@50 in the comparison (0.892).",
            "attachments": []
          }
        ]
      },
      {
        "id": "publications",
        "title": "Publications & conferences",
        "number": "04",
        "intro": "Conference papers and poster presentations on high-voltage insulator inspection.",
        "entries": [
          {
            "label": "RECPAD 2026 · Viseu, Portugal",
            "title": "Multi-Stage Object Detection for Electrical Grid Asset Inspection",
            "meta": "Igor Vilela, Pedro Rocha, Fernando Lopes and Luís Cruz",
            "description": "Conference paper and poster on separating insulator localisation from condition assessment in drone imagery.",
            "attachments": []
          },
          {
            "label": "RECPAD 2025 · Aveiro, Portugal",
            "title": "Optimizing Transfer Learning with High-Resolution Datasets for Voltage Insulator Defect Detection",
            "description": "Conference paper and poster on the effect of input resolution and model size on insulator defect detection.",
            "attachments": []
          }
        ]
      }
    ]
  }
  </script>
  <script>
    const cv = JSON.parse(document.getElementById('cv-data').textContent);
    const main = document.getElementById('content');
    const navLinks = [...document.querySelectorAll('nav a')];

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function fileLink({ label, src }) {
      const link = element('a', '', label);
      link.href = src;
      return link;
    }

    function renderEntry(entry) {
      const card = element('article', 'entry');
      if (entry.label) card.append(element('p', 'eyebrow', entry.label));
      card.append(element('h2', '', entry.title));
      if (entry.meta) card.append(element('p', 'meta', entry.meta));
      if (entry.description) card.append(element('p', '', entry.description));
      if (entry.steps?.length) {
        const steps = element('ol', 'steps');
        steps.setAttribute('aria-label', 'Inspection pipeline');
        for (const step of entry.steps) steps.append(element('li', '', step));
        card.append(steps);
      }

      const gallery = element('div', 'gallery');
      const documents = element('ul', 'documents');
      documents.setAttribute('aria-label', 'Documents');
      for (const attachment of entry.attachments ?? []) {
        if (attachment.kind === 'image') {
          const figure = element('figure');
          const link = fileLink(attachment);
          const image = element('img');
          image.src = attachment.src;
          image.alt = attachment.alt || attachment.label;
          image.loading = 'lazy';
          link.replaceChildren(image);
          figure.append(link, element('figcaption', '', attachment.label));
          gallery.append(figure);
        } else {
          const item = element('li');
          item.append(fileLink(attachment));
          documents.append(item);
        }
      }
      if (gallery.childElementCount) card.append(gallery);
      if (documents.childElementCount) card.append(documents);
      return card;
    }

    for (const section of cv.sections) {
      const page = element('section', 'chapter');
      page.id = section.id;
      page.hidden = true;
      const heading = element('h1', '', section.title);
      heading.id = section.id + '-title';
      heading.tabIndex = -1;
      page.setAttribute('aria-labelledby', heading.id);

      const inner = element('div', 'wrap');
      const header = element('div', 'chapter-head');
      header.append(element('p', 'eyebrow', 'Curriculum vitae / ' + section.number), heading, element('p', '', section.intro));
      const entries = element('div', 'entries');
      for (const entry of section.entries) entries.append(renderEntry(entry));
      inner.append(header, entries);
      page.append(inner);
      main.append(page);
    }

    if (cv.profilePhoto) {
      const photo = element('img');
      photo.src = cv.profilePhoto;
      photo.alt = '';
      document.getElementById('avatar').replaceChildren(photo);
    }

    if (cv.cvPdf) {
      const download = document.getElementById('download-cv');
      download.href = cv.cvPdf;
      download.hidden = false;
    } else {
      const print = document.getElementById('print-cv');
      print.hidden = false;
      print.addEventListener('click', () => window.print());
    }

    const pages = [...main.querySelectorAll(':scope > section')];
    let activePage = null;

    function showPage(focusHeading) {
      const id = location.hash.slice(1);
      if (id === 'content' && activePage) return;
      const page = pages.find(section => section.id === id) || pages[0];
      if (page === activePage) return;
      for (const section of pages) section.hidden = section !== page;
      for (const link of navLinks) {
        if (link.hash === '#' + page.id) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      }
      const heading = page.querySelector('h1');
      document.title = page.id === 'about' ? 'Igor Vilela · CV & Portfolio' : heading.textContent + ' · Igor Vilela';
      activePage = page;
      if (focusHeading) {
        heading.focus({ preventScroll: true });
        window.scrollTo(0, 0);
      }
    }

    showPage(false);
    window.addEventListener('hashchange', () => showPage(true));
  </script>
</body>
</html>
